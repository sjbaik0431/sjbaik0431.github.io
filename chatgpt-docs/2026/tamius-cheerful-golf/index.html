<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현교 은희 명화 은주 즐거운 명랑 골프</title><style>*{box-sizing:border-box}body{margin:0;background:#0c241f;color:#f2f9f1;font-family:system-ui,sans-serif}header,main,section{max-width:1100px;margin:auto;padding:20px}h1{font-size:clamp(26px,5vw,46px);color:#e4ffab}.sub{color:#bcd8c9;line-height:1.7}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}button{border:1px solid #8db59a;border-radius:24px;padding:12px 16px;background:#285342;color:#fff;cursor:pointer;font-weight:700}button:active{background:#b3e48c;color:#112}.layout{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.panel{border:1px solid #3d7561;border-radius:20px;background:#173b31;padding:18px}svg{width:100%;height:480px;background:#2d6045;border-radius:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border-radius:12px;text-align:left;min-height:130px;padding:13px}.card small{display:block;color:#c5ddcd;margin:6px 0}.selected{outline:3px solid #dcf9a9}textarea{width:100%;height:110px;background:#0b2b23;color:#fff;border:1px solid #709985;border-radius:10px;padding:10px;font:inherit}.note{background:#25483b;padding:12px;border-radius:10px;font-size:13px;line-height:1.6}p{line-height:1.7}@media(max-width:700px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}svg{height:410px}}</style></head><body><header><small>⛳ JEJU TAMIUS CC · FRIENDS GOLF</small><h1>현교 은희 명화 은주<br>즐거운 명랑 골프 🎉</h1><p class="sub">마운틴 · 레이크 18홀 | 티샷부터 그린까지 공이 움직이는 공략 시뮬레이션</p><div class="buttons"><button onclick="setCourse(0)">⛰ 마운틴</button><button onclick="setCourse(9)">💧 레이크</button><button onclick="toggleMusic()" id="music">♫ 오케스트라 음악 켜기</button></div><div class="note">실제 홀 축척·방위·비거리를 나타낸 지도는 아닙니다. 제공하신 영상 설명을 토대로 만든 전략 개념도입니다. 현장 바람·핀·캐디 안내를 우선하세요.</div></header><main class="layout"><div class="panel"><h2 id="title"></h2><p id="dist"></p><svg viewBox="0 0 440 590"><rect width="440" height="590" fill="#2c6043"/><path d="M210 515 C120 420 160 320 220 240 S260 140 215 80" stroke="#184432" stroke-width="155" fill="none" stroke-linecap="round"/><path d="M210 515 C120 420 160 320 220 240 S260 140 215 80" stroke="#6da75c" stroke-width="125" fill="none" stroke-linecap="round"/><ellipse cx="215" cy="78" rx="60" ry="42" fill="#b4d88c" stroke="#e0f5ad" stroke-width="4"/><g id="hazards"></g><path d="M215 80V35l32 12-32 12" fill="#ffca59" stroke="white" stroke-width="3"/><path id="trail" stroke="#fff7a2" stroke-width="4" stroke-dasharray="7 7" fill="none"/><circle id="ball" cx="210" cy="520" r="9" fill="white" stroke="#d2d2d2" stroke-width="2"/><text id="shot" x="16" y="25" fill="#fff3a5" font-size="17" font-weight="bold">▶ 플레이를 눌러주세요</text><text x="18" y="574" fill="white">TEE</text><text x="302" y="42" fill="white">GREEN</text></svg><div class="buttons"><button onclick="play()">▶ 공략 플레이</button><button onclick="move(-1)">← 이전 홀</button><button onclick="move(1)">다음 홀 →</button></div></div><div class="panel"><h2>📍 홀 특징</h2><p id="feature"></p><h2>🎯 추천 공략</h2><p id="tip"></p><h2>📝 나의 공략 노트</h2><textarea id="note" placeholder="바람, 클럽, 캐디 조언을 기록하세요"></textarea><p class="sub">노트는 이 브라우저에만 저장됩니다.</p></div></main><section><h2>18홀 공략 카드</h2><div id="cards" class="cards"></div></section><script>
const holes=[["마운틴","1","4","318m","넓은 페어웨이, 그린 앞 벙커","중앙 티샷 후 작은 그린에 거리 맞추기","중앙","앞"],["마운틴","2","4","미제공","좁은 IP, 긴 2단 그린","안전한 IP 지점에 안착 후 핀 단에 맞추기","중앙","앞"],["마운틴","3","3","142m","좌측 위험, 하트형 벙커","좌측 피하고 그린 중앙·우측 공략","우측","앞"],["마운틴","4","5","416m","내리막, 그린 뒤 벙커 세 개","안전하게 3타 전진하고 뒤쪽 벙커 피하기","중앙","뒤"],["마운틴","5","4","미제공","전방 워터 해저드, 그린 앞 벙커","물 넘길 캐리 확인하고 중앙 티샷","중앙","물앞"],["마운틴","6","3","미제공","바다 전망, 버디 기회","바람과 핀 거리 확인 후 정확한 클럽 선택","중앙","없음"],["마운틴","7","5","416m","핸디캡 1번, 긴 파5","중앙 티샷 후 우드·유틸리티로 3타 온","중앙","없음"],["마운틴","8","4","338m","페어웨이 우측 경사","좌측 능선 티샷, 세컨드 슬라이스 경계","좌측","없음"],["마운틴","9","4","미제공","그린 우측 벙커 무리","IP 나무 기준 티샷, 우측 벙커 피하기","좌측","우측"],["레이크","1","4","297m","짧은 파4, 항아리형 벙커","중앙 티샷 후 그린 앞 벙커 회피","중앙","앞"],["레이크","2","5","477m","긴 파5, 양쪽 PA와 숲","정확한 티샷, 무리한 투온보다 3타 온","중앙","양쪽"],["레이크","3","3","144m","현무암, 그린 주변 벙커","바람 계산 후 그린 앞 벙커 회피","중앙","앞"],["레이크","4","4","302m","페어웨이 벙커 다수","거리보다 안전한 랜딩 존 선택","좌측","중간"],["레이크","5","4","292m","우측 큰 벙커와 나무","좌측 중앙 티샷으로 우측 위험 피하기","좌측","우측"],["레이크","6","5","425m","좌측 호수, 우측 벙커","호수와 벙커 사이로 단계별 전진","중앙","물좌"],["레이크","7","3","145m","좌측 거대한 호수","캐리 확인하고 그린 우측 안전 구역 공략","우측","물좌"],["레이크","8","4","316m","우측 가드 벙커와 숲","안전한 랜딩 존으로 티샷 후 온그린","중앙","우측"],["레이크","9","4","304m","우측 긴 호수","좌측 중앙 티샷 후 정확한 아이언","좌측","물우"]];
let idx=0,raf=0,timeout=0,ac=null,musicTimer=0,musicOn=false,mi=0;
const $=id=>document.getElementById(id);
function stop(){cancelAnimationFrame(raf);clearTimeout(timeout)}
function hazards(h){let type=h[7],v='';const sand=(x,y,rx,ry)=>'<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="#ebd4a0" stroke="#fff1cb" stroke-width="3"/>';const water=(x,y,rx,ry)=>'<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="#328dbe" stroke="#8bd2e8" stroke-width="3"/>';if(type==='앞'||type==='물앞')v+=sand(212,150,38,17);if(type==='뒤')v+=sand(185,32,22,12)+sand(244,30,22,12);if(type==='우측')v+=sand(290,148,32,22);if(type==='중간')v+=sand(160,340,26,17)+sand(295,310,25,15);if(type==='양쪽')v+=water(40,310,42,130)+sand(395,260,32,90);if(type==='물좌')v+=water(35,255,75,180);if(type==='물우')v+=water(410,245,75,185);if(type==='물앞')v+=water(210,450,120,30);return v}
function render(){stop();let h=holes[idx];$('title').textContent=h[0]+' '+h[1]+'홀 · PAR '+h[2];$('dist').textContent='전장 '+h[3];$('feature').textContent=h[4];$('tip').textContent=h[5];$('hazards').innerHTML=hazards(h);$('ball').setAttribute('cx',210);$('ball').setAttribute('cy',520);$('trail').setAttribute('d','');$('shot').textContent='▶ 플레이를 눌러주세요';$('note').value=localStorage.getItem('tamius-friends-'+idx)||'';$('cards').innerHTML=holes.map((a,i)=>'<button class="card '+(i===idx?'selected':'')+'" onclick="choose('+i+')"><b>'+a[0]+' '+a[1]+'홀 · PAR '+a[2]+'</b><small>'+a[3]+'</small>'+a[4]+'</button>').join('')}
function choose(i){idx=i;render();window.scrollTo({top:0,behavior:'smooth'})}function setCourse(i){choose(i)}function move(n){choose((idx+n+18)%18)}
$('note').addEventListener('input',()=>localStorage.setItem('tamius-friends-'+idx,$('note').value));
function play(){stop();let h=holes[idx],x=h[6]==='좌측'?155:h[6]==='우측'?285:220,pts=h[2]==='3'?[[210,520],[x,80]]:h[2]==='5'?[[210,520],[x,345],[x,195],[215,80]]:[[210,520],[x,280],[215,80]],shot=0;function step(){if(shot>=pts.length-1){$('shot').textContent='✓ 홀 공략 완료!';return}let a=pts[shot],b=pts[shot+1],start=performance.now();$('shot').textContent=shot===0?'🏌 티샷':shot===pts.length-2?'⛳ 그린 공략':'🏌 세컨드 샷';function tick(now){let t=Math.min(1,(now-start)/1300),e=1-(1-t)*(1-t),x=a[0]+(b[0]-a[0])*e,y=a[1]+(b[1]-a[1])*e-25*Math.sin(Math.PI*e);$('ball').setAttribute('cx',x);$('ball').setAttribute('cy',y);let path=pts.slice(0,shot+1).concat([[x,y]]);$('trail').setAttribute('d',path.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' '));if(t<1)raf=requestAnimationFrame(tick);else{shot++;timeout=setTimeout(step,450)}}raf=requestAnimationFrame(tick)}step()}
// Cheerful original orchestral-style fanfare, synthesized with Web Audio.
let master=null,seqHandle=null,seq=0;
const tune=[76,79,81,79,76,72,74,76,79,76,74,72,74,76,72,0,72,76,79,84,83,79,76,74,76,79,81,79,76,74,72,0];
const chords=[[48,52,55],[53,57,60],[55,59,62],[48,52,55]];
function voice(midi,time,duration,type,level,attack=.012){
 const f=440*Math.pow(2,(midi-69)/12),o=ac.createOscillator(),g=ac.createGain();
 o.type=type;o.frequency.setValueAtTime(f,time);
 g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(Math.max(.0002,level),time+attack);
 g.gain.exponentialRampToValueAtTime(.0001,time+duration);
 o.connect(g);g.connect(master);o.start(time);o.stop(time+duration+.03);
}
function beat(){
 if(!musicOn||!ac)return;
 const t=ac.currentTime,i=seq%tune.length,m=tune[i],bar=Math.floor(seq/8)%4;
 if(m){voice(m,t,.19,'sawtooth',.055);voice(m-12,t,.17,'triangle',.032)}
 if(i%2===0){for(const n of chords[bar])voice(n,t,.31,'triangle',.024,.025)}
 if(i%4===0){voice(chords[bar][0]-12,t,.37,'sine',.09)}
 // Short pizzicato pulse and high bell-like accent.
 if(i%2===1)voice(60,t,.075,'square',.012);
 if(i%8===7)voice(88,t,.24,'sine',.035);
 seq++;seqHandle=setTimeout(beat,195);
}
async function toggleMusic(){
 if(musicOn){musicOn=false;clearTimeout(seqHandle);$('music').textContent='♫ 오케스트라 음악 켜기';return}
 try{
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  if(!master){master=ac.createGain();master.gain.value=.75;const limiter=ac.createDynamicsCompressor();limiter.threshold.value=-14;limiter.ratio.value=5;master.connect(limiter);limiter.connect(ac.destination)}
  await ac.resume();musicOn=true;$('music').textContent='♫ 음악 끄기';beat();
 }catch(e){alert('브라우저에서 음악 재생이 제한되었습니다.')}
}
render();</script></body></html>
