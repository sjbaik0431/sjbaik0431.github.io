<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="ptTitle" color="var(--pony-pink, #F5A9BE)">
  <title id="ptTitle">꽃잎</title>
  <g transform="rotate(-14 32 32)">
    <!-- petal body: pointed stem end at the bottom, soft lobe at the top -->
    <path d="M32 61 C21 51 13 40 14 27 C15 13 24 3 34 4 C45 5 51 16 50 29 C49 42 42 52 32 61 Z" fill="currentColor"/>
    <!-- shaded far half -->
    <path d="M34 4 C45 5 51 16 50 29 C49 42 42 52 32 61 C42 45 45 22 34 4 Z" fill="#000000" opacity="0.12"/>
    <!-- curled near edge catching the light -->
    <path d="M32 61 C22 51 15 40 15 27 C15 15 22 6 30 5 C24 19 22 42 32 61 Z" fill="#FFFFFF" opacity="0.32"/>
    <!-- veins -->
    <path d="M30 56 C26 41 27 23 33 8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.45"/>
    <path d="M36 48 C35 36 36 24 40 15" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.22"/>
  </g>
</svg>
